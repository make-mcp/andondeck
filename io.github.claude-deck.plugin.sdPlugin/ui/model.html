<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Claude Deck</title>
		<script src="./libs/sdpi-components.js"></script>
		<style>
			.hint { color: #9d9a94; font-size: 11px; line-height: 1.45; padding: 4px 0 8px; }
			.hint code { color: #d97757; }
			.warn { color: #d9a157; }
		</style>
	</head>
	<body>
		<sdpi-item label="Switch to">
			<sdpi-select setting="model" default="">
				<option value="">Cycle through models</option>
				<option value="default">Default</option>
				<option value="opus">Opus</option>
				<option value="sonnet">Sonnet</option>
				<option value="haiku">Haiku</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="Session">
			<sdpi-select setting="session" datasource="getSessions" placeholder="Active session"></sdpi-select>
		</sdpi-item>
		<div class="hint">
			The key shows the model the session is using now. Switching is sent as <code>/model</code> through the
			queue, so it lands at the next turn boundary rather than mid-turn.
		</div>
	</body>
</html>
