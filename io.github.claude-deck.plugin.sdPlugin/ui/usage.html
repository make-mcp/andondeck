<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Claude Deck</title>
		<script src="./libs/sdpi-components.js"></script>
		<style>
			.hint { color: #9d9a94; font-size: 11px; line-height: 1.45; padding: 4px 0 8px; }
			.hint code { color: #d97757; }
		</style>
	</head>
	<body>
		<sdpi-item label="Metric">
			<sdpi-select setting="metric" default="turn">
				<option value="turn">Turn timer</option>
				<option value="context">Context pressure</option>
				<option value="tokens">Tokens</option>
				<option value="tools">Tool calls</option>
				<option value="busy">Time spent working</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="Session">
			<sdpi-select setting="session" datasource="getSessions" placeholder="Active session"></sdpi-select>
		</sdpi-item>
		<div class="hint">Token numbers come from the session transcript when the plugin can read it; turns, tool calls and timings always work. Press or rotate to step through the metrics.</div>
	</body>
</html>
