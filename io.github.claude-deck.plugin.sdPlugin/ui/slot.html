<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Claude Deck</title>
		<script src="./libs/sdpi-components.js"></script>
		<style>
			.hint { color: #948E86; font-size: 11px; line-height: 1.45; padding: 4px 0 8px; }
			.hint code { color: #E8A33D; }
		</style>
	</head>
	<body>
		<sdpi-item label="Slot">
			<sdpi-range setting="index" default="1" min="1" max="8" step="1" showlabels></sdpi-range>
		</sdpi-item>
		<sdpi-item label="Pressing it">
			<sdpi-select setting="press" default="pin">
				<option value="pin">Pins this session for the other keys</option>
				<option value="approve">Approves what it is asking for</option>
			</sdpi-select>
		</sdpi-item>
		<div class="hint">
			Slots are handed out in the order sessions started, so a key keeps its project for as long as that
			session lives. A row of these turns the deck into a board of everything running.
		</div>
	</body>
</html>
